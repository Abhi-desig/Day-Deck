# pnpm 11 moved build-script approval here from package.json's "pnpm" field.
# better-sqlite3 is a native module and MUST compile, otherwise the main
# process has no database. electron-winstaller is Windows-only packaging.
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  # node-pty has no published prebuild for this platform, so its install script
  # compiles it. It targets N-API (node-addon-api), which is ABI-stable, so the
  # binary Node builds here loads unchanged in Electron — no electron-rebuild.
  node-pty: true
  electron-winstaller: false
  # ffmpeg-static ships no binary in the tarball — its install script downloads
  # the right build for this platform from the package's GitHub release. So the
  # script is not optional here: without it the package is a path helper
  # pointing at a file that does not exist, and the trimmer fails at runtime
  # rather than at install time. (ffprobe-static needs no script; its binaries
  # are in the tarball.)
  ffmpeg-static: true
minimumReleaseAgeExclude:
  - '@xyflow/react@12.11.3'
  - '@xyflow/system@0.0.80'
