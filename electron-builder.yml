appId: com.amber.daydeck
productName: Day Deck
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig*.json,electron-builder.yml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
asarUnpack:
  - '**/*.node'
  # node-pty execs `spawn-helper` from beside its binary, and an executable
  # cannot be run from inside an asar. Its own path logic already rewrites
  # app.asar -> app.asar.unpacked, so the whole package has to be out there.
  - '**/node_modules/node-pty/**'
  # Same rule, same reason: ffmpeg is an executable, and an executable cannot
  # be run from inside an asar. services/ffmpeg.ts rewrites
  # app.asar -> app.asar.unpacked on the path the package reports, which only
  # works if the file is actually out there.
  - '**/node_modules/ffmpeg-static/**'
mac:
  category: public.app-category.productivity
  # Generated by scripts/make-icon.mjs — `pnpm icon`, chained into dist:mac.
  icon: build/icon.icns
  # Deliberately unsigned. Signing needs an Apple Developer ID and notarization
  # needs credentials neither this repo nor the build machine has; an unsigned
  # arm64 dmg runs fine on the machine that built it, which is what this is for.
  # Anyone else has to right-click → Open the first time. See README.
  identity: null
  target:
    - target: dmg
      arch: [arm64]
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: true
